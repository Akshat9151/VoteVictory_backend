name: CI/CD Pipeline - Voting Management System Backend

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voting_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov ruff mypy

      - name: Code Linting & Style Check
        run: |
          ruff check .

      - name: Run Test Suite with Coverage
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/voting_test_db
          DATABASE_SYNC_URL: postgresql://postgres:postgres@localhost:5432/voting_test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-ci-secret-key-32-chars-length!
          ENVIRONMENT: testing
        run: |
          pytest --cov=app tests/ -v

      - name: Build Docker Container
        run: |
          docker build -t voting-backend:${{ github.sha }} .
