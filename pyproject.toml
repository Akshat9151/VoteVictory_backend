[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voting-management-system-backend"
version = "1.0.0"
description = "Enterprise-Grade Voting and Election Management System Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "redis>=5.0.4",
    "celery>=5.4.0",
    "passlib[argon2,bcrypt]>=1.7.4",
    "argon2-cffi>=23.1.0",
    "bcrypt>=4.1.3",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.7",
    "pyotp>=2.9.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pandas>=2.2.2",
    "openpyxl>=3.1.3",
    "python-dotenv>=1.0.1",
    "email-validator>=2.1.1",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.1",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "alembic",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "F403", "F405", "E711", "E712", "E402", "F401", "F841", "W291", "W292", "W293", "F541", "E741", "F811"]
